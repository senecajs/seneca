# Continuous integration: clean install, build and test across supported
# Node.js versions and operating systems.
# Publishing is handled separately by release.yml (npm trusted publishing).

name: build

on:
  push:
    branches: [master, 3.x]
  pull_request:
    branches: [master, 3.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - run: npm install
      - run: npm run build --if-present
      - run: npm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Coverage upload is informational only and must never block a build.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          package-manager-cache: false

      - run: npm install
      - run: npm run build --if-present
      - run: npm run coveralls

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
