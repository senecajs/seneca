# Publish a release to npm with npm trusted publishing (GitHub OIDC).
#
# No npm token exists anywhere: the publish job exchanges a short-lived GitHub
# OIDC token for a publish credential, and npm attaches build provenance.
#
# Trigger: workflow_dispatch only (Actions > release > Run workflow, or
# `gh workflow run release.yml -f dry-run=false`). A run releases the
# package.json version of the selected branch:
#   * dry-run (the default): validate, build, test and pack; nothing is
#     published.
#   * dry-run off: also publish to npm, then create the tag vX.Y.Z on the
#     published commit and the GitHub release. Publishing is only allowed
#     from the default branch and from maintenance branches named N.x.
#
# The npm trusted publisher of the `seneca` package must be configured as
#   Organization or user: senecajs
#   Repository:           seneca
#   Workflow filename:    release.yml
#   Environment name:     (none)
# with the "npm publish" action allowed. See docs/how-to/create-a-release.md.
#
# Layout: the `validate` job installs dependencies, builds and tests, and has
# no OIDC permission. The `publish` job never runs third-party code: it
# checks out the commit that was validated, checks it again with the
# dependency-free validation script, and publishes the committed files.
#
# Only one release runs at a time in this repository, so two runs cannot
# publish concurrently and move the latest dist-tag backward. Later runs,
# dry runs included, wait in a queue instead of replacing a pending run.
#
# Actions are pinned to commits; Dependabot keeps the pins up to date.

name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run: validate, build, test and pack, but do not publish'
        type: boolean
        default: true
      dist-tag:
        description: 'npm dist-tag (empty: latest, or next for a prerelease; for example 3x for a maintenance release)'
        type: string
        default: ''

# One release at a time in the repository. Runs queue (up to 100) instead
# of replacing the pending run, and a run in progress is never cancelled
# (cancel-in-progress defaults to false and may not be combined with max).
concurrency:
  group: release
  queue: max

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  validate:
    name: validate, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      dist_tag: ${{ steps.check.outputs.dist_tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
      - name: Plan the run
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          dry_run="$INPUT_DRY_RUN"
          # Publish only from the default branch or a maintenance branch, so
          # that a run started on a feature branch cannot release it.
          if [ "$dry_run" != true ]; then
            if [ "$REF_TYPE" != branch ] ||
              { [ "$REF_NAME" != "$DEFAULT_BRANCH" ] && ! printf '%s' "$REF_NAME" | grep -Eq '^[0-9]+\.x$'; }; then
              echo "::error::publish from $DEFAULT_BRANCH or a maintenance branch (N.x), not $REF_TYPE $REF_NAME; enable dry-run to validate it"
              exit 1
            fi
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "ref=$REF_TYPE $REF_NAME dry_run=$dry_run"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The publish job checks out this exact commit, not the branch head.
      - name: Record the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: npm install
      - run: npm run build
      - run: npm test

      - name: Validate the release
        id: check
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: >-
          node .github/scripts/validate-release.js
          --tag "v$(node -p 'require("./package.json").version')"
          --dist-tag "$DIST_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Check the tag
        env:
          TAG: ${{ steps.check.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: bash .github/scripts/check-release-tag.sh

      - name: Pack (dry run)
        env:
          DIST_TAG: ${{ steps.check.outputs.dist_tag }}
        run: npm publish --dry-run --ignore-scripts --tag "$DIST_TAG"

  publish:
    name: publish
    needs: validate
    if: needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # mint the OIDC token for npm trusted publishing

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Check the tag again
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: bash .github/scripts/check-release-tag.sh

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the npm version
        # Trusted publishing needs npm 11.5.1 or later; Node.js 24 bundles a
        # newer one. Nothing is installed in this job, so an older npm fails.
        run: |
          node -e '
            const [major, minor, patch] = require("node:child_process")
              .execSync("npm --version").toString().trim().split(".").map(Number)
            const ok = 11 < major || (11 === major && (5 < minor || (5 === minor && 1 <= patch)))
            console.log("npm " + [major, minor, patch].join(".") + (ok ? "" : ": too old for trusted publishing"))
            process.exit(ok ? 0 : 1)
          '

      - name: Validate the release again
        id: check
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: >-
          node .github/scripts/validate-release.js
          --tag "$TAG" --dist-tag "$DIST_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.check.outputs.dist_tag }}
        run: npm publish --ignore-scripts --tag "$DIST_TAG"

      - name: Verify the published package
        env:
          VERSION: ${{ steps.check.outputs.version }}
          DIST_TAG: ${{ steps.check.outputs.dist_tag }}
        run: |
          for i in $(seq 1 30); do
            if [ "$(npm view "seneca@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then break; fi
            echo "waiting for the registry ($i)"
            sleep 10
          done
          test "$(npm view "seneca@$VERSION" version)" = "$VERSION"
          test "$(npm view seneca "dist-tags.$DIST_TAG")" = "$VERSION"
          attestations="$(npm view "seneca@$VERSION" dist.attestations.url)"
          test -n "$attestations"
          echo "provenance attestation: $attestations"
          echo "Published [seneca@$VERSION](https://www.npmjs.com/package/seneca/v/$VERSION) as $DIST_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the registry signature and provenance attestation
        # Informational: the version is already published when this runs.
        continue-on-error: true
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          npm init -y > /dev/null
          npm install "seneca@$VERSION" --ignore-scripts --no-audit --no-fund
          npm audit signatures

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          flags=(--title "$TAG" --notes-file "$NOTES")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
          else
            # Creates the tag on the published commit when it does not exist.
            gh release create "$TAG" --target "$SHA" "${flags[@]}"
          fi
          gh release view "$TAG" --json url --jq .url
